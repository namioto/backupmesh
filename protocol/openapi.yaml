openapi: 3.1.0
info:
  title: BackupMesh Control API
  version: 1.0.0
  description: |
    The language-neutral control-plane contract between a Source Agent and a
    Storage Agent. Operational endpoints require mutually authenticated TLS. Pairing
    bootstrap uses a short-lived one-time code and an explicitly pinned Storage certificate. A peer
    MUST additionally authorize the authenticated certificate identity for the
    requested agent and operation; possession of a trusted certificate alone is
    not authorization.
servers:
  - url: https://{storage_agent}/api/v1
    variables:
      storage_agent:
        default: backupmesh-storage.local:7443
security:
  - mutualTLS: []
tags:
  - name: Storage
  - name: Backup
  - name: Source
paths:
  /pairing/sessions:
    post:
      tags: [Source]
      operationId: createPairingSession
      summary: Create a ten-minute one-time pairing session
      description: Available only over the loopback endpoint to the local tray app. The returned certificate fingerprint must be transferred with the code and verified by the Source before exchange. When rebind_agent_id is set, the resulting code can only re-pair that existing Source Agent; otherwise it can only mint a brand new one, since agent_id is shown in the tray's Connections list and is not itself a secret.
      security: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                rebind_agent_id: {type: string, format: uuid, nullable: true}
      responses:
        '200':
          description: One-time pairing details
          content:
            application/json:
              schema:
                type: object
                required: [code, expires_at, control_endpoint, certificate_sha256]
                properties:
                  code: {type: string, minLength: 20, maxLength: 64}
                  expires_at: {type: string, format: date-time}
                  control_endpoint: {type: string, format: uri}
                  certificate_sha256: {type: string, pattern: '^[0-9A-F]{64}$'}
                  rebind_agent_id: {type: string, format: uuid, nullable: true}
        '403': {$ref: '#/components/responses/Error'}
  /pairing/exchange:
    post:
      tags: [Source]
      operationId: exchangePairingCode
      summary: Exchange a one-time code for Source credentials
      description: The Source must pin the SHA-256 certificate fingerprint before sending the code. Codes expire after ten minutes and are consumed atomically once. If the code was bound to a specific agent_id by /pairing/sessions, only that agent_id may be exchanged; otherwise agent_id must not already belong to a paired Source.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code, agent_id, agent_name]
              properties:
                code: {type: string, minLength: 20, maxLength: 64}
                agent_id: {type: string, format: uuid}
                agent_name: {type: string, minLength: 1, maxLength: 128}
      responses:
        '200': {description: Identity-bound bearer credential and mTLS certificate bundle}
        '401': {$ref: '#/components/responses/Error'}
        '409': {description: The code is not authorized to identify as the given agent_id}
        default: {$ref: '#/components/responses/Error'}
  /pairing/rotate-authority:
    post:
      tags: [Source]
      operationId: rotateStorageAuthority
      summary: Discard the Storage pairing CA and server certificate
      description: Available only over the loopback endpoint to the local tray app. Takes effect only after the Storage Service restarts; every currently paired Source Agent must be re-paired afterward, but its agent_id, catalog, and revocation status are unaffected.
      security: []
      responses:
        '200':
          description: Authority material discarded
          content:
            application/json:
              schema:
                type: object
                required: [restart_required]
                properties:
                  restart_required: {type: boolean}
        '403': {$ref: '#/components/responses/Error'}
  /certificate/renew:
    post:
      tags: [Source]
      operationId: renewCertificate
      summary: Reissue the authenticated Source Agent's client certificate
      description: Requires the caller's current, still-valid client certificate and bearer token - no one-time code or tray interaction is needed. Each call mints a fresh key rather than reusing the current one.
      responses:
        '200': {description: Fresh mTLS certificate bundle for the authenticated Source Agent}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
  /service/shutdown:
    post:
      tags: [Storage]
      operationId: shutdownStorageService
      summary: Gracefully stop the local Storage Service
      description: Available only over the loopback endpoint so the test launcher can stop repository child processes cleanly.
      security: []
      responses:
        '202': {description: Shutdown scheduled}
        '403': {$ref: '#/components/responses/Error'}
        default: {$ref: '#/components/responses/Error'}
  /pairing/credential:
    post:
      tags: [Source]
      operationId: issuePairingCredential
      summary: Issue a credential for one Source Agent
      description: This bootstrap operation is available only over the Storage Agent loopback endpoint. It returns a Source identity, an identity-bound bearer credential, and a client certificate signed by the Storage Agent pairing authority. Only SHA-256 credential hashes and the DPAPI-protected authority key are persisted.
      security: []
      responses:
        '200':
          description: Newly issued Source Agent pairing bundle
          content:
            application/json:
              schema:
                type: object
                required: [agent_id, control_endpoint, credential, certificate_pem, private_key_pem, authority_pem, expires_at, issued_at]
                properties:
                  agent_id: {type: string, format: uuid}
                  control_endpoint: {type: string, format: uri}
                  credential: {type: string, minLength: 43}
                  certificate_pem: {type: string}
                  private_key_pem: {type: string}
                  authority_pem: {type: string}
                  expires_at: {type: string, format: date-time}
                  issued_at: {type: string, format: date-time}
        '403': {$ref: '#/components/responses/Error'}
        default: {$ref: '#/components/responses/Error'}
  /storage/devices/{device_id}/eject:
    post:
      tags: [Storage]
      operationId: ejectStorageDevice
      summary: Request safe removal of a registered removable storage device
      parameters:
        - {name: device_id, in: path, required: true, schema: {type: string, format: uuid}}
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/SentAt'
      responses:
        '202': {description: Windows accepted the safe-removal request}
        '409': {$ref: '#/components/responses/Error'}
        default: {$ref: '#/components/responses/Error'}
  /storage/status:
    get:
      tags: [Storage]
      operationId: getStorageStatus
      summary: Read the Storage Agent and attached storage state
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/AgentId'
      responses:
        '200':
          description: Current status
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StorageStatus'
              examples:
                ready:
                  value:
                    agent_id: 70b07bb4-7c93-4f3a-8715-78f5cd8e8a65
                    state: ready
                    observed_at: '2026-08-28T02:15:04.238Z'
                    storage:
                      storage_id: 34edec25-10e3-4652-aa2c-56cc65090044
                      label: Offsite A
                      capacity_bytes: 4000787030016
                      available_bytes: 3123456789012
                      filesystem: NTFS
                      repository_endpoint: https://backupmesh-storage.local:8000/repo
                    active_job_id: null
        default:
          $ref: '#/components/responses/Error'
  /backup/request:
    post:
      tags: [Backup]
      operationId: requestBackup
      summary: Request admission of a new backup job
      description: |
        This operation is idempotent for the same authenticated Source Agent and
        Idempotency-Key. Reuse with a different body MUST return 409 IDEMPOTENCY_CONFLICT.
        Servers MUST retain completed key outcomes for at least 24 hours.
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/AgentId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/SentAt'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BackupRequest'
            examples:
              daily:
                value:
                  job_id: 177142fa-cf88-45a0-b3b3-6272ae19150a
                  source_agent_id: f91436ac-0ca9-4bcb-b0d0-42bc7181f611
                  requested_at: '2026-08-28T02:16:00Z'
                  repository: home-main
                  snapshot_tags: [daily, laptop]
      responses:
        '202':
          description: Job admitted (or the original response replayed)
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
            Idempotency-Replayed:
              $ref: '#/components/headers/IdempotencyReplayed'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BackupAdmission'
        '409':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /automation/settings:
    get:
      tags: [Storage]
      operationId: getAutomationSettings
      summary: Read the service-authoritative automatic backup setting
      responses:
        '200':
          description: Current automation setting
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AutomationSettings'}
        default: {$ref: '#/components/responses/Error'}
    put:
      tags: [Storage]
      operationId: updateAutomationSettings
      summary: Enable or disable automatic backups
      description: Available only over the loopback endpoint to the local tray application.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AutomationSettings'}
      responses:
        '200':
          description: Updated automation setting
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AutomationSettings'}
        '403': {$ref: '#/components/responses/Error'}
        default: {$ref: '#/components/responses/Error'}
  /backup/commands/enqueue:
    post:
      tags: [Backup]
      operationId: enqueueBackupCommands
      summary: Queue mapped backups selected by the local tray application
      description: Available only over the loopback endpoint. Only ready, enabled mappings are queued.
      security: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/SentAt'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/BackupCommandEnqueueRequest'}
      responses:
        '202':
          description: Commands queued
          content:
            application/json:
              schema: {$ref: '#/components/schemas/BackupCommandEnqueueResult'}
        '409': {$ref: '#/components/responses/Error'}
        default: {$ref: '#/components/responses/Error'}
  /backup/commands/claim/{source_agent_id}:
    post:
      tags: [Source]
      operationId: claimBackupCommand
      summary: Lease the next pending command for a Source Agent
      parameters:
        - {name: source_agent_id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '200':
          description: A leased command, or null when the queue is empty
          content:
            application/json:
              schema: {$ref: '#/components/schemas/BackupCommandClaimResponse'}
        '403': {$ref: '#/components/responses/Error'}
        default: {$ref: '#/components/responses/Error'}
  /backup/commands/result:
    post:
      tags: [Source]
      operationId: reportBackupCommandResult
      summary: Complete a leased backup command
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/AgentId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/SentAt'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/BackupCommandResultRequest'}
      responses:
        '204': {description: Result recorded}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        default: {$ref: '#/components/responses/Error'}
  /backup/targets/{source_agent_id}/{backup_set_id}:
    get:
      tags: [Backup]
      operationId: listBackupTargets
      summary: List mapped storage targets for one Source Backup Set
      parameters:
        - $ref: '#/components/parameters/AgentId'
        - {name: source_agent_id, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: backup_set_id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '200':
          description: Mapped targets and their current readiness
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/BackupTargetAvailability'}
        default: {$ref: '#/components/responses/Error'}
  /backup/progress:
    post:
      tags: [Backup]
      operationId: reportBackupProgress
      summary: Report monotonic job progress
      description: |
        sequence starts at 1 and MUST increase for a job. Duplicate reports with
        the same event_id and body are accepted; an event_id reused with another
        body returns 409 REPLAY_CONFLICT. Reports for terminal jobs are rejected.
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/AgentId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/SentAt'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BackupProgress'
      responses:
        '204':
          description: Progress recorded
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
            Idempotency-Replayed:
              $ref: '#/components/headers/IdempotencyReplayed'
        default:
          $ref: '#/components/responses/Error'
  /backup/result:
    post:
      tags: [Backup]
      operationId: reportBackupResult
      summary: Record a terminal job result
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/AgentId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/SentAt'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BackupResult'
      responses:
        '204':
          description: Result recorded
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
            Idempotency-Replayed:
              $ref: '#/components/headers/IdempotencyReplayed'
        default:
          $ref: '#/components/responses/Error'
  /backup/cancel:
    post:
      tags: [Backup]
      operationId: cancelBackup
      summary: Request cancellation of a backup
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/AgentId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/SentAt'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CancelRequest'
      responses:
        '202':
          description: Cancellation request accepted
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
            Idempotency-Replayed:
              $ref: '#/components/headers/IdempotencyReplayed'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobStatus'
        default:
          $ref: '#/components/responses/Error'
  /backup/status/{job_id}:
    get:
      tags: [Backup]
      operationId: getBackupStatus
      summary: Read a job's current state
      parameters:
        - $ref: '#/components/parameters/JobId'
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/AgentId'
      responses:
        '200':
          description: Current job state
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobStatus'
        '404':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /backup/jobs:
    get:
      tags: [Backup]
      operationId: listBackupJobs
      summary: List backup jobs newest first for Storage Agent monitoring
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/AgentId'
      responses:
        '200':
          description: Backup job history held by this Storage Service process
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/JobStatus'
        default:
          $ref: '#/components/responses/Error'
  /source/catalog:
    post:
      tags: [Source]
      operationId: publishSourceCatalog
      summary: Publish the Source Agent's current Backup Set catalog
      description: |
        Replaces the previously published catalog for the authenticated Source
        Agent. The source_agent_id in the body MUST match the paired certificate
        identity. Removing a Backup Set leaves its target mappings unresolved so
        the user can review them instead of silently deleting configuration.
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/AgentId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/SentAt'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SourceCatalog'
      responses:
        '204':
          description: Catalog stored
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
            Idempotency-Replayed:
              $ref: '#/components/headers/IdempotencyReplayed'
        default:
          $ref: '#/components/responses/Error'
  /source/catalogs:
    get:
      tags: [Source]
      operationId: listSourceCatalogs
      summary: List catalogs published by paired Source Agents
      description: Intended for the authenticated local Storage Agent UI.
      parameters:
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: Published Source catalogs
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                type: array
                maxItems: 1024
                items:
                  $ref: '#/components/schemas/SourceCatalog'
        default:
          $ref: '#/components/responses/Error'
  /sources:
    get:
      tags: [Source]
      operationId: listSourceConnections
      summary: List paired Source Agents and their revocation status
      description: Available only over the loopback endpoint to the local tray app.
      security: []
      responses:
        '200':
          description: Known Source Agent connections
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [agent_id, agent_name, reported_agent_name, last_seen_at, backup_set_count, revoked]
                  properties:
                    agent_id: {type: string, format: uuid}
                    agent_name: {type: string, description: The tray's display name - a rename override if one was set, otherwise the same as reported_agent_name.}
                    reported_agent_name: {type: string, description: The name the Source Agent itself reports in its catalog sync, unaffected by tray renames.}
                    last_seen_at: {type: string, format: date-time}
                    backup_set_count: {type: integer, minimum: 0}
                    revoked: {type: boolean}
                    certificate_expires_at: {type: string, format: date-time, nullable: true, description: 'Null if this Source paired only through the deprecated file-bundle path.'}
        '403': {$ref: '#/components/responses/Error'}
  /sources/{agent_id}/name:
    put:
      tags: [Source]
      operationId: renameSource
      summary: Override the tray's display name for a Source Agent
      description: Available only over the loopback endpoint to the local tray app. Never changes the name the Source Agent reports in its own catalog sync.
      security: []
      parameters:
        - name: agent_id
          in: path
          required: true
          schema: {type: string, format: uuid}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                display_name: {type: string, maxLength: 128, nullable: true, description: Empty or null clears the override.}
      responses:
        '200':
          description: Display name updated
          content:
            application/json:
              schema:
                type: object
                required: [agent_id]
                properties:
                  agent_id: {type: string, format: uuid}
                  display_name: {type: string, nullable: true}
        '403': {$ref: '#/components/responses/Error'}
  /sources/{agent_id}/forget:
    post:
      tags: [Source]
      operationId: forgetSource
      summary: Revoke a Source Agent and remove it from the Connections list
      description: Available only over the loopback endpoint to the local tray app. Backup Set mappings that reference this Source are preserved unresolved rather than deleted, and resolve again if it is later re-paired and unrevoked under the same agent_id.
      security: []
      parameters:
        - name: agent_id
          in: path
          required: true
          schema: {type: string, format: uuid}
      responses:
        '200':
          description: Source forgotten
          content:
            application/json:
              schema:
                type: object
                required: [agent_id, forgotten]
                properties:
                  agent_id: {type: string, format: uuid}
                  forgotten: {type: boolean}
        '403': {$ref: '#/components/responses/Error'}
  /sources/{agent_id}/revoke:
    post:
      tags: [Source]
      operationId: revokeSource
      summary: Immediately block a Source Agent from the control API
      description: Available only over the loopback endpoint to the local tray app. Takes effect on the Source Agent's next request even with a valid certificate and bearer token.
      security: []
      parameters:
        - name: agent_id
          in: path
          required: true
          schema: {type: string, format: uuid}
      responses:
        '200':
          description: Revocation recorded
          content:
            application/json:
              schema:
                type: object
                required: [agent_id, revoked]
                properties:
                  agent_id: {type: string, format: uuid}
                  revoked: {type: boolean}
        '403': {$ref: '#/components/responses/Error'}
  /sources/{agent_id}/unrevoke:
    post:
      tags: [Source]
      operationId: unrevokeSource
      summary: Restore a previously revoked Source Agent's control API access
      description: Available only over the loopback endpoint to the local tray app.
      security: []
      parameters:
        - name: agent_id
          in: path
          required: true
          schema: {type: string, format: uuid}
      responses:
        '200':
          description: Revocation cleared
          content:
            application/json:
              schema:
                type: object
                required: [agent_id, revoked]
                properties:
                  agent_id: {type: string, format: uuid}
                  revoked: {type: boolean}
        '403': {$ref: '#/components/responses/Error'}
  /storage/configuration:
    get:
      tags: [Storage]
      operationId: getStorageConfiguration
      summary: Read the authoritative Storage Agent topology
      responses:
        '200':
          description: Current configuration and optimistic-concurrency revision
          content:
            application/json:
              schema: {$ref: '#/components/schemas/StorageConfigurationDocument'}
        default: {$ref: '#/components/responses/Error'}
    put:
      tags: [Storage]
      operationId: updateStorageConfiguration
      summary: Replace the authoritative Storage Agent topology
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/StorageConfigurationUpdate'}
      responses:
        '200':
          description: Configuration stored
          content:
            application/json:
              schema: {$ref: '#/components/schemas/StorageConfigurationDocument'}
        '409': {$ref: '#/components/responses/Error'}
        default: {$ref: '#/components/responses/Error'}
  /storage/devices/status:
    get:
      tags: [Storage]
      operationId: listStorageDeviceStatus
      summary: List connection and arrival-delay state for registered storage
      responses:
        '200':
          description: Registered device presence
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/RegisteredDevicePresence'}
        default: {$ref: '#/components/responses/Error'}
  /storage/volumes:
    get:
      tags: [Storage]
      operationId: listStorageVolumes
      summary: List fixed and removable Windows volumes available for registration
      responses:
        '200':
          description: Currently available storage volumes
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/StorageVolumeInfo'}
        default: {$ref: '#/components/responses/Error'}
components:
  securitySchemes:
    mutualTLS:
      type: mutualTLS
      description: TLS 1.3 mTLS using a paired, non-expired agent certificate.
  parameters:
    AgentId:
      name: X-BackupMesh-Agent-ID
      in: header
      required: true
      description: Source Agent UUID. A pairing credential is bound to this identity on its first authenticated request.
      schema:
        type: string
        format: uuid
    JobId:
      name: job_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    RequestId:
      name: X-Request-ID
      in: header
      required: true
      description: UUID v4 generated once by the caller and preserved in logs.
      schema:
        type: string
        format: uuid
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Opaque caller-generated key scoped to authenticated identity and operation.
      schema:
        type: string
        minLength: 16
        maxLength: 128
        pattern: '^[A-Za-z0-9._~-]+$'
    SentAt:
      name: X-BackupMesh-Sent-At
      in: header
      required: true
